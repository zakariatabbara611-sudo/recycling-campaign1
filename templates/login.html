{% extends 'base.html' %}
{% block title %}Login | Farzi Recycling Initiative{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2 style="color: var(--primary);">Welcome Back</h2>
            <p style="color: #666; font-size: 0.95rem;">Sign in to access your recycling dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div style="margin-bottom: 1rem;">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; font-size: 1rem;">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
